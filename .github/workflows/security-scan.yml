name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block large files (>5MB)
        run: |
          LARGE=$(git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' | awk '$1=="blob" && $2 > 5242880 {print $3}')
          if [ -n "$LARGE" ]; then
            echo "::error::Large files detected (>5MB):"
            echo "$LARGE"
            echo "::error::Remove these files and rewrite history before merging."
            exit 1
          fi
          echo "✅ No large files"

      - name: Block sensitive file types
        run: |
          BLOCKED=$(git ls-files | grep -iE '\.(sqlite|sqlite3|db|tar\.gz|tar\.bz2|7z|pem|key|p12|pfx|jks|keystore)$' || true)
          # Exclude .env.example
          BLOCKED=$(echo "$BLOCKED" | grep -v '.env.example' || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::Blocked file types found:"
            echo "$BLOCKED"
            echo "::error::These file types are never allowed in the repo."
            exit 1
          fi
          echo "✅ No blocked file types"

      - name: Block .env files
        run: |
          ENV_FILES=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::.env file detected — NEVER commit environment files:"
            echo "$ENV_FILES"
            exit 1
          fi
          echo "✅ No .env files"

      - name: Scan for common secret patterns
        run: |
          # Only scan files tracked in HEAD (not history)
          PATTERNS=(
            'SG\.[A-Za-z0-9_-]{40,}'           # SendGrid API keys
            'sk_live_[A-Za-z0-9]{20,}'         # Stripe live keys
            'whsec_[A-Za-z0-9]{20,}'           # Stripe webhook secrets
            'dop_v1_[A-Za-z0-9]{20,}'          # DigitalOcean tokens
            'ghp_[A-Za-z0-9]{30,}'             # GitHub PATs
            'ghs_[A-Za-z0-9]{30,}'             # GitHub secrets
            'GOCSPX-[A-Za-z0-9_-]{20,}'         # Google OAuth secrets
            'cfut_[A-Za-z0-9]{20,}'             # Cloudflare tokens
            '-----BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY-----'  # Private keys
          )
          FOUND=0
          for file in $(git ls-files); do
            # Skip binary files and .env.example
            if [[ "$file" == ".env.example" ]]; then continue; fi
            if file "$file" 2>/dev/null | grep -q 'binary'; then continue; fi
            for pat in "${PATTERNS[@]}"; do
              if grep -qE "$pat" "$file" 2>/dev/null; then
                echo "::warning::Potential secret in $file — matches pattern: $pat"
                FOUND=1
              fi
            done
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Secret patterns found — review before merging"
            # Don't block (false positives possible) but flag prominently
          else
            echo "✅ No secret patterns detected"
          fi

      - name: Check .gitignore coverage
        run: |
          MISSING=0
          for pattern in '*.sqlite' '*.db' '*.tar.gz' '*.pem' '*.key' '.env' 'backups/' 'instance/'; do
            if ! grep -qF "$pattern" .gitignore; then
              echo "::warning::.gitignore missing: $pattern"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "✅ .gitignore covers all critical patterns"
          fi
